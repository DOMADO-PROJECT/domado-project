" stroke="#60738a" stroke-width="1.5"/><circle class="step-badge" cx="320.0" cy="1296" r="24" fill="#e9eef4"/><text x="320.0" y="1304" font-size="24" font-weight="650" class="accent step-index" text-anchor="middle">04</text><text x="320.0" y="1372" font-size="32" font-weight="700" class="" text-anchor="middle">이야기와 연락</text><text x="320.0" y="1418" font-size="26" font-weight="600" class="" text-anchor="middle">프로젝트 카드 · 연락</text><text x="320.0" y="1464" font-size="26" font-weight="400" class="muted" text-anchor="middle">작업의 이야기를 읽고</text><text x="320.0" y="1500" font-size="26" font-weight="400" class="muted" text-anchor="middle">링크를 열거나 연락합니다.</text></g></svg>
