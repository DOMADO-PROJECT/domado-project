<svg xmlns="http://www.w3.org/2000/svg" width="640" height="908" viewBox="0 0 640 908" role="img" aria-labelledby="title desc">
<title id="title">연락 폼의 상태 흐름</title><desc id="desc">작성과 검증, 전송 요청을 거쳐 성공과 오류로 나뉜다. 가로 화면에서는 왼쪽에서 오른쪽으로, 모바일에서는 위에서 아래로 읽는다. 갈라지는 연결은 화살표 머리 없이 양쪽 결과 카드까지 흐른다. 성공이면 입력을 초기화하고 종이비행기를 띄우며, 오류나 시간 초과이면 작성 내용을 유지해 다시 시도한다. 두 갈래의 움직임은 가능한 경로를 보여주며 실제로 두 결과가 함께 발생하는 뜻은 아니다.</desc>
<style>
text { font-family:"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif; fill:#191f28; }
.muted { fill:#566270; } .accent { fill:#60738a; }
.trace { fill:none; stroke:#60738a; stroke-width:2; stroke-dasharray:10 18; animation:travel 4s linear infinite; }
@keyframes travel { to { stroke-dashoffset:-112; } }
@media (prefers-reduced-motion:reduce) { .trace { animation:none !important; stroke-dasharray:none; opacity:.6; } }

.structure { fill:none; stroke:#cbd5df; stroke-width:1.8; stroke-linejoin:round; }
.request,.branch { fill:none; stroke:#91a1b5; stroke-width:2; stroke-linejoin:round; }
.request { marker-end:url(#arrow); }
.signal { fill:none; stroke:#60738a; stroke-width:2.8; stroke-linecap:round; stroke-dasharray:.18 .82; opacity:0; animation:transit 6s linear infinite; }
@keyframes transit {
  0%,12% { stroke-dashoffset:1; opacity:0; }
  14% { opacity:1; }
  34% { stroke-dashoffset:-.2; opacity:1; }
  36%,100% { stroke-dashoffset:-.2; opacity:0; }
}
@media (prefers-reduced-motion:reduce) { .signal { animation:none !important; opacity:0; } }

.signal,.route-signal { stroke-dasharray:.18 1.82; }
.signal { animation-name:advance,signal-visible; }
.head-signal { fill:none; stroke:none; marker-end:url(#active-arrow); opacity:0; animation:arrow-arrival 6s linear infinite; }
.dash-signal { fill:none; stroke:#60738a; stroke-width:2.8; stroke-dasharray:6 6; opacity:0; animation:dash-flow 1.2s linear infinite,signal-visible 6s linear infinite; }
[data-dashed] > .request { stroke-dasharray:6 6; animation:dash-flow 1.2s linear infinite; }
.result-flow { opacity:0; animation:signal-visible 6s linear var(--result-delay) infinite; }
.route-signal { fill:none; stroke:#60738a; stroke-width:2.8; stroke-linecap:round; stroke-linejoin:round; animation:advance 6s linear var(--result-delay) infinite; }
@keyframes advance { 0%,12% { stroke-dashoffset:.18; } 34%,100% { stroke-dashoffset:-1; } }
@keyframes signal-visible { 0%,12%,36%,100% { opacity:0; } 14%,34% { opacity:1; } }
@keyframes arrow-arrival { 0%,30% { opacity:0; } 32%,35% { opacity:1; } 38%,100% { opacity:0; } }
@keyframes dash-flow { to { stroke-dashoffset:-12; } }
@media (prefers-reduced-motion:reduce) {
  .head-signal,.dash-signal,.result-flow { animation:none!important; opacity:0; }
  .route-signal,[data-dashed] > .request { animation:none!important; }
}
</style><rect x="1" y="1" width="638" height="906" rx="10" fill="#ffffff"/><rect x="1" y="1" width="638" height="906" rx="10" fill="none" stroke="#e5e8eb"/><image data-brand-mark="" x="26" y="33.23" width="25.92" height="20.16" href="data:image/svg+xml;base64,"/><text x="66" y="52" font-size="25" font-weight="750" class="" text-anchor="start">DOMADO PROJECT</text><text x="26" y="104" font-size="16" font-weight="650" class="accent" text-anchor="start">CONTACT FLOW</text><text x="614" y="104" font-size="15" font-weight="400" class="muted" text-anchor="end">작성 → 전송 → 결과에 맞춘 피드백</text><path d="M26 130H614" stroke="#e5e8eb"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#91a1b5" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><defs><marker id="active-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto" overflow="visible"><path d="M1 1L9 5L1 9" fill="none" stroke="#60738a" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><g id="compose" data-card="작성과 검증" data-align="middle"><rect x="26" y="166" width="588" height="126" rx="14" fill="#f5f7fa"/><g data-copy=""><text x="320.0" y="217.07999999999998" font-size="32" font-weight="700" class="" text-anchor="middle">작성과 검증</text><text x="320.0" y="263.08" font-size="26" font-weight="400" class="muted" text-anchor="middle">이메일·내용 필수 · 이름 선택</text></g></g><g id="request" data-card="전송 요청" data-align="middle"><rect x="26" y="354" width="588" height="178" rx="14" fill="#e9eef4"/><g data-copy=""><text x="320.0" y="413.08" font-size="32" font-weight="700" class="" text-anchor="middle">전송 요청</text><text x="320.0" y="459.08" font-size="26" font-weight="400" class="muted" text-anchor="middle">입력 잠금 · 중복 전송 방지</text><text x="320.0" y="495.08" font-size="26" font-weight="400" class="muted" text-anchor="middle">EmailJS · 최대 15초 대기</text></g></g><g id="success" data-card="성공 응답" data-align="middle"><rect x="26" y="670" width="282" height="198" rx="14" fill="#eef4f0"/><g data-copy=""><text x="167.0" y="739.08" font-size="32" font-weight="700" class="" text-anchor="middle">성공 응답</text><text x="167.0" y="785.08" font-size="26" font-weight="400" class="muted" text-anchor="middle">입력 초기화</text><text x="167.0" y="821.08" font-size="26" font-weight="400" class="muted" text-anchor="middle">종이비행기 이륙</text></g></g><g id="error" data-card="오류·시간 초과" data-align="middle"><rect x="332" y="670" width="282" height="198" rx="14" fill="#f5f7fa"/><g data-copy=""><text x="473.0" y="739.08" font-size="32" font-weight="700" class="" text-anchor="middle">오류·시간 초과</text><text x="473.0" y="785.08" font-size="26" font-weight="400" class="muted" text-anchor="middle">작성 내용 유지</text><text x="473.0" y="821.08" font-size="26" font-weight="400" class="muted" text-anchor="middle">다시 시도</text></g></g><g data-from="compose" data-to="request" data-kind="request"><path d="M320 292V354" class="request"/><path d="M320 292V354" class="signal" pathLength="1" style="animation-delay:0s"/><path d="M320 292V354" class="head-signal" style="animation-delay:0s"/></g><text x="344" y="334" font-size="26" font-weight="400" class="muted" text-anchor="start">검증 통과</text><g data-from="request" data-to="response" data-kind="branch"><path d="M320 532V592" class="branch"/></g><g id="response"><g data-from="response" data-to="success" data-kind="branch"><path d="M320 592H167V670" class="branch"/></g><g data-from="response" data-to="error" data-kind="branch"><path d="M320 592H473V670" class="branch"/></g></g><g class="result-flow" style="--result-delay:1.8s"><path data-route-from="request" data-route-to="success" d="M320 532V592H167V670" class="route-signal" pathLength="1"/><path data-route-from="request" data-route-to="error" d="M320 532V592H473V670" class="route-signal" pathLength="1"/></g></svg>
