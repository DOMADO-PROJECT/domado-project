t-anchor="middle">main.js</text><text x="126.0" y="756.08" font-size="26" font-weight="400" class="muted" text-anchor="middle">화면 · 입력</text><text x="126.0" y="792.08" font-size="26" font-weight="400" class="muted" text-anchor="middle">소리 연결</text></g></g><g id="entry" data-card="진입과 사운드" data-align="middle"><rect x="248" y="416" width="346" height="184" rx="14" fill="#ffffff"/><g data-copy=""><text x="421.0" y="478.08" font-size="32" font-weight="700" class="" text-anchor="middle">진입과 사운드</text><text x="421.0" y="524.0799999999999" font-size="26" font-weight="400" class="muted" text-anchor="middle">브랜드 인트로</text><text x="421.0" y="560.0799999999999" font-size="26" font-weight="400" class="muted" text-anchor="middle">Web Audio</text></g></g><g data-from="coordinator" data-to="entry" data-kind="structure"><path d="M202 740H222V508H248" class="structure"/><path d="M202 740H222V508H248" class="signal" pathLength="1" style="animation-delay:1.4s"/></g><g id="space" data-card="3D 공간" data-align="middle"><rect x="248" y="648" width="346" height="184" rx="14" fill="#ffffff"/><g data-copy=""><text x="421.0" y="710.08" font-size="32" font-weight="700" class="" text-anchor="middle">3D 공간</text><text x="421.0" y="756.08" font-size="26" font-weight="400" class="muted" text-anchor="middle">Three.js · 절차적 모델</text><text x="421.0" y="792.08" font-size="26" font-weight="400" class="muted" text-anchor="middle">카메라 · 아이콘</text></g></g><g data-from="coordinator" data-to="space" data-kind="structure"><path d="M202 740H222V740H248" class="structure"/><path d="M202 740H222V740H248" class="signal" pathLength="1" style="animation-delay:1.4s"/></g><g id="contact" data-card="소개와 연락" data-align="middle"><rect x="248" y="880" width="346" height="184" rx="14" fill="#ffffff"/><g data-copy=""><text x="421.0" y="942.08" font-size="32" font-weight="700" class="" text-anchor="middle">소개와 연락</text><text x="421.0" y="988.08" font-size="26" font-weight="400" class="muted" text-anchor="middle">프로젝트 · 채널</text><text x="421.0" y="1024.08" font-size="26" font-weight="400" class="muted" text-anchor="middle">dialog · 연락 폼</text></g></g><g data-from="coordinator" data-to="contact" data-kind="structure"><path d="M202 740H222V972H248" class="structure"/><path d="M202 740H222V972H248" class="signal" pathLength="1" style="animation-delay:1.4s"/></g><g id="emailjs" data-card="EmailJS" data-align="middle"><rect x="76" y="1212" width="488" height="116" rx="14" fill="#fcf4f1"/><g data-copy=""><text x="320.0" y="1258.0800000000002" font-size="32" font-weight="700" class="" text-anchor="middle">EmailJS</text><text x="320.0" y="1304.0800000000002" font-size="26" font-weight="400" class="muted" text-anchor="middle">HTTPS 직접 요청</text></g></g><g data-from="deploy" data-to="browser" data-kind="request"><path d="M320 282V346" class="request"/><path d="M320 282V346" class="signal" pathLength="1" style="animation-delay:0s"/><path d="M320 282V346" class="head-signal" style="animation-delay:0s"/></g><text x="344" y="324" font-size="26" font-weight="400" class="muted" text-anchor="start">정적 파일</text><g data-from="contact" data-to="emailjs" data-kind="request" data-dashed="true"><path d="M421 1064V1164H320V1212" class="request"/></g><text x="444" y="1160" font-size="26" font-weight="400" class="muted" text-anchor="start">연락 전송 시</text></svg>
