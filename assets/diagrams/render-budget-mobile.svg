<svg xmlns="http://www.w3.org/2000/svg" width="640" height="820" viewBox="0 0 640 820" role="img" aria-labelledby="title desc">
<title id="title">데스크톱과 모바일의 렌더링 구성</title><desc id="desc">기기별 렌더링 부담을 고려해 장면의 밀도와 해상도 상한을 다르게 구성했다. 데스크톱은 오브젝트 315개, 배경 별 432개, 픽셀 비율 상한 1.75. 모바일은 각각 200개, 288개, 1.5다.</desc>
<style>
text { font-family:"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif; fill:#191f28; }
.muted { fill:#566270; } .accent { fill:#60738a; }
.trace { fill:none; stroke:#60738a; stroke-width:2; stroke-dasharray:10 18; animation:travel 4s linear infinite; }
@keyframes travel { to { stroke-dashoffset:-112; } }
@media (prefers-reduced-motion:reduce) { .trace { animation:none !important; stroke-dasharray:none; opacity:.6; } }
</style><rect x="1" y="1" width="638" height="818" rx="10" fill="#ffffff"/><rect x="1" y="1" width="638" height="818" rx="10" fill="none" stroke="#e5e8eb"/><image data-brand-mark="" x="26" y="33.23" width="25.92" height="20.16" href="data:image/svg+xml;base64,"/><text x="66" y="52" font-size="25" font-weight="750" class="" text-anchor="start">DOMADO PROJECT</text><text x="26" y="104" font-size="16" font-weight="650" class="accent" text-anchor="start">ADAPTIVE RENDERING</text><text x="614" y="104" font-size="15" font-weight="400" class="muted" text-anchor="end">기기에 맞춘 장면 밀도와 해상도</text><path d="M26 130H614" stroke="#e5e8eb"/><rect x="26" y="166" width="588" height="284" rx="14" fill="#f5f7fa"/><text x="54" y="215" font-size="27" font-weight="700" class="" text-anchor="start">데스크톱</text><text x="586" y="213" font-size="17" font-weight="400" class="muted" text-anchor="end">화면 폭 641px 이상</text><path d="M54 241H586" stroke="#e0e5eb"/><text x="54" y="287" font-size="20" font-weight="400" class="muted" text-anchor="start">공간의 오브젝트</text><g data-budget="wide.objects" data-value="315"><text x="586" y="287" font-size="25" font-weight="650" class="" text-anchor="end">315개</text></g><text x="54" y="349" font-size="20" font-weight="400" class="muted" text-anchor="start">배경의 별</text><g data-budget="wide.stars" data-value="432"><text x="586" y="349" font-size="25" font-weight="650" class="" text-anchor="end">432개</text></g><text x="54" y="411" font-size="20" font-weight="400" class="muted" text-anchor="start">픽셀 비율 상한</text><g data-budget="wide.pixelRatioCap" data-value="1.75"><text x="586" y="411" font-size="25" font-weight="650" class="" text-anchor="end">1.75</text></g><rect x="26" y="482" width="588" height="284" rx="14" fill="#f5f7fa"/><text x="54" y="531" font-size="27" font-weight="700" class="" text-anchor="start">모바일</text><text x="586" y="529" font-size="17" font-weight="400" class="muted" text-anchor="end">화면 폭 640px 이하</text><path d="M54 557H586" stroke="#e0e5eb"/><text x="54" y="603" font-size="20" font-weight="400" class="muted" text-anchor="start">공간의 오브젝트</text><g data-budget="narrow.objects" data-value="200"><text x="586" y="603" font-size="25" font-weight="650" class="" text-anchor="end">200개</text></g><text x="54" y="665" font-size="20" font-weight="400" class="muted" text-anchor="start">배경의 별</text><g data-budget="narrow.stars" data-value="288"><text x="586" y="665" font-size="25" font-weight="650" class="" text-anchor="end">288개</text></g><text x="54" y="727" font-size="20" font-weight="400" class="muted" text-anchor="start">픽셀 비율 상한</text><g data-budget="narrow.pixelRatioCap" data-value="1.5"><text x="586" y="727" font-size="25" font-weight="650" class="" text-anchor="end">1.5</text></g><text x="26" y="793" font-size="17" font-weight="400" class="muted" text-anchor="start">오브젝트는 초기 화면 폭에 맞춰 구성합니다.</text></svg>
