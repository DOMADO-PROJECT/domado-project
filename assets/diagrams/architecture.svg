<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="656" viewBox="0 0 1280 656" role="img" aria-labelledby="title desc">
<title id="title">DOMADO PROJECT 실행 구조</title><desc id="desc">정적 배포, 브라우저 내부, 외부 전송의 경계를 나눈다. 브라우저 안의 main.js가 진입과 사운드, 3D 공간, 소개와 연락을 연결한다. 연락 전송 시에만 연락 폼에서 EmailJS로 HTTPS 요청을 보내며 이 경로는 점선으로 표시한다.</desc>
<style>
text { font-family:"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif; fill:#191f28; }
.muted { fill:#566270; } .accent { fill:#60738a; }
.trace { fill:none; stroke:#60738a; stroke-width:2; stroke-dasharray:10 18; animation:travel 4s linear infinite; }
@keyframes travel { to { stroke-dashoffset:-112; } }
@media (prefers-reduced-motion:reduce) { .trace { animation:none !important; stroke-dasharray:none; opacity:.6; } }

.structure { fill:none; stroke:#cbd5df; stroke-width:1.8; stroke-linejoin:round; }
.request,.branch { fill:none; stroke:#91a1b5; stroke-width:2; stroke-linejoin:round; }
.request { marker-end:url(#arrow); }
.signal { fill:none; stroke:#60738a; stroke-width:2.8; stroke-linecap:round; stroke-dasharray:.18 .82; opacity:0; animation:transit 6s linear infinite; }
@keyframes transit {
  0%,12% { stroke-dashoffset:1; opacity:0; }
  14% { opacity:1; }
  34% { stroke-dashoffset:-.2; opacity:1; }
  36%,100% { stroke-dashoffset:-.2; opacity:0; }
}
@media (prefers-reduced-motion:reduce) { .signal { animation:none !important; opacity:0; } }

.signal,.route-signal { stroke-dasharray:.18 1.82; }
.signal { animation-name:advance,signal-visible; }
.head-signal { fill:none; stroke:none; marker-end:url(#active-arrow); opacity:0; animation:arrow-arrival 6s linear infinite; }
.dash-signal { fill:none; stroke:#60738a; stroke-width:2.8; stroke-dasharray:6 6; opacity:0; animation:dash-flow 1.2s linear infinite,signal-visible 6s linear infinite; }
[data-dashed] > .request { stroke-dasharray:6 6; animation:dash-flow 1.2s linear infinite; }
.result-flow { opacity:0; animation:signal-visible 6s linear var(--result-delay) infinite; }
.route-signal { fill:none; stroke:#60738a; stroke-width:2.8; stroke-linecap:round; stroke-linejoin:round; animation:advance 6s linear var(--result-delay) infinite; }
@keyframes advance { 0%,12% { stroke-dashoffset:.18; } 34%,100% { stroke-dashoffset:-1; } }
@keyframes signal-visible { 0%,12%,36%,100% { opacity:0; } 14%,34% { opacity:1; } }
@keyframes arrow-arrival { 0%,30% { opacity:0; } 32%,35% { opacity:1; } 38%,100% { opacity:0; } }
@keyframes dash-flow { to { stroke-dashoffset:-12; } }
@media (prefers-reduced-motion:reduce) {
  .head-signal,.dash-signal,.result-flow { animation:none!important; opacity:0; }
  .route-signal,[data-dashed] > .request { animation:none!important; }
}

.card-outline { opacity:0; animation:arrow-arrival 6s linear var(--delay) infinite; }
@media (prefers-reduced-motion:reduce) { .card-outline { animation:none !important; } }
</style><rect x="1" y="1" width="1278" height="654" rx="10" fill="#ffffff"/><rect x="1" y="1" width="1278" height="654" rx="10" fill="none" stroke="#e5e8eb"/><image data-brand-mark="" x="40" y="33.23" width="25.92" height="20.16" href="data:image/svg+xml;base64,"/><text x="80" y="52" font-size="25" font-weight="750" class="" text-anchor="start">DOMADO PROJECT</text><text x="365" y="51" font-size="16" font-weight="650" class="accent" text-anchor="start">ARCHITECTURE</text><text x="1240" y="51" font-size="15" font-weight="400" class="muted" text-anchor="end">정적 배포 · 브라우저에서 실행</text><path d="M40 80H1240" stroke="#e5e8eb"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto"><path d="M1 1L9 5L1 9" fill="none" stroke="#91a1b5" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><defs><marker id="active-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="10" markerHeight="10" markerUnits="userSpaceOnUse" orient="auto" overflow="visible"><path d="M1 1L9 5L1 9" fill="none" stroke="#60738a" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><text x="150" y="279" font-size="18" font-weight="650" class="accent" text-anchor="middle">정적 배포</text><g id="deploy" data-card="Vercel" data-align="middle"><rect x="40" y="304" width="220" height="136" rx="14" fill="#fcf4f1"/><g data-copy=""><text x="150.0" y="347.16" font-size="26" font-weight="700" class="" text-anchor="middle">Vercel</text><text x="150.0" y="387.16" font-size="20" font-weight="400" class="muted" text-anchor="middle">정적 파일 · 에셋</text><text x="150.0" y="415.16" font-size="20" font-weight="400" class="muted" text-anchor="middle">HTML · CSS · JS</text></g></g><g id="browser"><rect x="326" y="120" width="628" height="504" rx="14" fill="#f5f7fa"/></g><text x="350" y="161" font-size="26" font-weight="700" class="" text-anchor="start">브라우저</text><g id="coordinator" data-card="main.js" data-align="middle"><rect x="350" y="304" width="220" height="136" rx="14" fill="#e9eef4"/><rect class="card-outline" x="350" y="304" width="220" height="136" rx="14" fill="none" stroke="#60738a" stroke-width="1.5" style="--delay:0s"/><g data-copy=""><text x="460.0" y="347.16" font-size="26" font-weight="700" class="" text-anchor="middle">main.js</text><text x="460.0" y="387.16" font-size="20" font-weight="400" class="muted" text-anchor="middle">화면 · 입력</text><text x="460.0" y="415.16" font-size="20" font-weight="400" class="muted" text-anchor="middle">소리 연결</text></g></g><g id="entry" data-card="진입과 사운드" data-align="middle"><rect x="646" y="148" width="280" height="120" rx="14" fill="#ffffff"/><rect class="card-outline" x="646" y="148" width="280" height="120" rx="14" fill="none" stroke="#60738a" stroke-width="1.5" style="--delay:1.4s"/><g data-copy=""><text x="786.0" y="183.16000000000003" font-size="26" font-weight="700" class="" text-anchor="middle">진입과 사운드</text><text x="786.0" y="223.16000000000003" font-size="20" font-weight="400" class="muted" text-anchor="middle">브랜드 인트로</text><text x="786.0" y="251.16000000000003" font-size="20" font-weight="400" class="muted" text-anchor="middle">Web Audio</text></g></g><g data-from="coordinator" data-to="entry" data-kind="structure"><path d="M570 372H610V208H646" class="structure"/><path d="M570 372H610V208H646" class="signal" pathLength="1" style="animation-delay:1.4s"/></g><g id="space" data-card="3D 공간" data-align="middle"><rect x="646" y="312" width="280" height="120" rx="14" fill="#ffffff"/><rect class="card-outline" x="646" y="312" width="280" height="120" rx="14" fill="none" stroke="#60738a" stroke-width="1.5" style="--delay:1.4s"/><g data-copy=""><text x="786.0" y="347.16" font-size="26" font-weight="700" class="" text-anchor="middle">3D 공간</text><text x="786.0" y="387.16" font-size="20" font-weight="400" class="muted" text-anchor="middle">Three.js · 절차적 모델</text><text x="786.0" y="415.16" font-size="20" font-weight="400" class="muted" text-anchor="middle">카메라 · 아이콘</text></g></g><g data-from="coordinator" data-to="space" data-kind="structure"><path d="M570 372H610V372H646" class="structure"/><path d="M570 372H610V372H646" class="signal" pathLength="1" style="animation-delay:1.4s"/></g><g id="contact" data-card="소개와 연락" data-align="middle"><rect x="646" y="476" width="280" height="120" rx="14" fill="#ffffff"/><rect class="card-outline" x="646" y="476" width="280" height="120" rx="14" fill="none" stroke="#60738a" stroke-width="1.5" style="--delay:1.4s"/><g data-copy=""><text x="786.0" y="511.16" font-size="26" font-weight="700" class="" text-anchor="middle">소개와 연락</text><text x="786.0" y="551.1600000000001" font-size="20" font-weight="400" class="muted" text-anchor="middle">프로젝트 · 채널</text><text x="786.0" y="579.1600000000001" font-size="20" font-weight="400" class="muted" text-anchor="middle">dialog · 연락 폼</text></g></g><g data-from="coordinator" data-to="contact" data-kind="structure"><path d="M570 372H610V536H646" class="structure"/><path d="M570 372H610V536H646" class="signal" pathLength="1" style="animation-delay:1.4s"/></g><text x="1130" y="451" font-size="18" font-weight="650" class="accent" text-anchor="middle">외부 전송</text><g id="emailjs" data-card="EmailJS" data-align="middle"><rect x="1020" y="476" width="220" height="120" rx="14" fill="#fcf4f1"/><g data-copy=""><text x="1130.0" y="525.16" font-size="26" font-weight="700" class="" text-anchor="middle">EmailJS</text><text x="1130.0" y="565.16" font-size="20" font-weight="400" class="muted" text-anchor="middle">HTTPS 직접 요청</text></g></g><g data-from="deploy" data-to="browser" data-kind="request"><path d="M260 372H350" class="request"/><path d="M260 372H350" class="signal" pathLength="1" style="animation-delay:0s"/><path d="M260 372H350" class="head-signal" style="animation-delay:0s"/></g><text x="293" y="354" font-size="18" font-weight="400" class="muted" text-anchor="middle">로드</text><g data-from="contact" data-to="emailjs" data-kind="request" data-dashed="true"><path d="M926 536H1020" class="request"/></g><text x="973" y="518" font-size="18" font-weight="400" class="muted" text-anchor="middle">전송 시</text></svg>
